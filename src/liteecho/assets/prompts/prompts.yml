# Original prompts for LiteEcho (Apache-2.0). One entry per language code.
# Keys are quoted on purpose: an unquoted `no` would be read as a boolean.
"af": "Goeie môre almal, dankie dat julle kon aansluit. Sal ons begin met 'n vinnige opdatering?"
"ar": "مرحباً بالجميع، شكراً لانضمامكم. هل نبدأ بتحديث سريع، ثم نتفق على الخطوات القادمة؟"
"az": "Hamıya salam, qoşulduğunuz üçün təşəkkür edirəm. Qısa yeniləmə ilə başlayaq, yoxsa əvvəlcə gündəliyə baxaq?"
"be": "Добры дзень, дзякуй, што далучыліся. Пачнём з кароткага агляду, а потым дамовімся пра наступныя крокі?"
"bg": "Здравейте на всички, благодаря, че се включихте. Да започнем ли с кратка актуализация, а после да уточним следващите стъпки?"
"bn": "সবাইকে নমস্কার, যোগ দেওয়ার জন্য ধন্যবাদ। আমরা কি একটি সংক্ষিপ্ত আপডেট দিয়ে শুরু করব, তারপর পরবর্তী পদক্ষেপ ঠিক করব?"
"bs": "Zdravo svima, hvala što ste se pridružili. Hoćemo li početi kratkim pregledom, a zatim dogovoriti sljedeće korake?"
"ca": "Bon dia a tothom, gràcies per connectar-vos. Comencem amb una actualització ràpida i després acordem els propers passos?"
"cs": "Dobrý den všem, děkuji, že jste se připojili. Začneme krátkým shrnutím a pak se domluvíme na dalších krocích?"
"cy": "Bore da bawb, diolch am ymuno. Gawn ni ddechrau gyda diweddariad cyflym, ac yna cytuno ar y camau nesaf?"
"da": "Goddag allesammen, tak fordi I deltager. Skal vi starte med en kort status og derefter aftale de næste skridt?"
"de": "Guten Tag zusammen, danke, dass Sie dabei sind. Sollen wir mit einem kurzen Überblick beginnen und dann die nächsten Schritte besprechen?"
"el": "Καλημέρα σε όλους, ευχαριστώ που συμμετέχετε. Να ξεκινήσουμε με μια σύντομη ενημέρωση και μετά να συμφωνήσουμε τα επόμενα βήματα;"
"en": "Hello everyone, thanks for joining. Shall we start with a quick update, and then agree on the next steps?"
"es": "Hola a todos, gracias por conectarse. ¿Empezamos con un resumen rápido y luego acordamos los próximos pasos?"
"et": "Tere kõigile, aitäh, et liitusite. Kas alustame lühikese ülevaatega ja lepime siis kokku järgmised sammud?"
"eu": "Egun on guztioi, eskerrik asko batzeagatik. Eguneratze labur batekin hasiko gara, eta gero hurrengo urratsak adostu?"
"fa": "سلام به همه، ممنون که حضور دارید. آیا با یک گزارش کوتاه شروع کنیم و بعد درباره مراحل بعدی تصمیم بگیریم؟"
"fi": "Hei kaikille, kiitos kun liityitte mukaan. Aloitetaanko lyhyellä tilannekatsauksella ja sovitaan sitten seuraavista askelista?"
"fr": "Bonjour à tous, merci de vous être joints à nous. Si on commençait par un point rapide, avant de convenir des prochaines étapes ?"
"gl": "Bo día a todos, grazas por unirvos. Comezamos cunha actualización rápida e despois acordamos os próximos pasos?"
"gu": "બધાને નમસ્તે, જોડાવા બદલ આભાર. શું આપણે ટૂંકા અપડેટથી શરૂઆત કરીએ અને પછી આગળનાં પગલાં નક્કી કરીએ?"
"he": "שלום לכולם, תודה שהצטרפתם. נתחיל בעדכון קצר, ואז נסכים על הצעדים הבאים?"
"hi": "सभी को नमस्कार, जुड़ने के लिए धन्यवाद। क्या हम एक छोटे अपडेट से शुरू करें, फिर अगले कदम तय करें?"
"hr": "Pozdrav svima, hvala što ste se pridružili. Hoćemo li početi kratkim pregledom, a zatim dogovoriti sljedeće korake?"
"hu": "Üdvözlök mindenkit, köszönöm, hogy csatlakoztak. Kezdjük egy rövid összefoglalóval, aztán megbeszéljük a következő lépéseket?"
"id": "Halo semuanya, terima kasih sudah bergabung. Apakah kita mulai dengan pembaruan singkat, lalu menyepakati langkah selanjutnya?"
"is": "Góðan daginn öll, takk fyrir að mæta. Eigum við að byrja á stuttri yfirferð og ákveða svo næstu skref?"
"it": "Buongiorno a tutti, grazie per essere intervenuti. Iniziamo con un breve aggiornamento e poi concordiamo i prossimi passi?"
"ja": "皆さん、こんにちは。ご参加ありがとうございます。まず簡単な状況報告から始めて、次のステップを決めましょうか。"
"ka": "გამარჯობა ყველას, გმადლობთ, რომ შემოგვიერთდით. დავიწყოთ მოკლე მიმოხილვით და შემდეგ შევთანხმდეთ შემდეგ ნაბიჯებზე?"
"kk": "Бәріңізге сәлем, қосылғандарыңызға рақмет. Қысқаша шолудан бастаймыз ба, содан кейін келесі қадамдарды келісеміз бе?"
"kn": "ಎಲ್ಲರಿಗೂ ನಮಸ್ಕಾರ, ಸೇರಿದ್ದಕ್ಕೆ ಧನ್ಯವಾದಗಳು. ಒಂದು ಸಂಕ್ಷಿಪ್ತ ಸಾರಾಂಶದಿಂದ ಶುರು ಮಾಡಿ, ನಂತರ ಮುಂದಿನ ಹೆಜ್ಜೆಗಳನ್ನು ನಿರ್ಧರಿಸೋಣವೇ?"
"ko": "안녕하세요, 여러분. 참석해 주셔서 감사합니다. 간단한 현황 공유부터 시작하고, 다음 단계를 정할까요?"
"lt": "Sveiki visi, ačiū, kad prisijungėte. Ar pradėkime nuo trumpos apžvalgos, o tada sutarkime dėl kitų žingsnių?"
"lv": "Labdien visiem, paldies, ka pievienojāties. Vai sāksim ar īsu pārskatu un pēc tam vienosimies par nākamajiem soļiem?"
"mk": "Здраво на сите, благодарам што се приклучивте. Дали да започнеме со краток преглед, а потоа да се договориме за следните чекори?"
"ml": "എല്ലാവർക്കും നമസ്കാരം, ചേർന്നതിന് നന്ദി. ഒരു ചെറിയ അവലോകനത്തോടെ തുടങ്ങിയിട്ട് അടുത്ത ഘട്ടങ്ങൾ തീരുമാനിച്ചാലോ?"
"mr": "सर्वांना नमस्कार, सहभागी झाल्याबद्दल धन्यवाद. आपण एका छोट्या आढाव्याने सुरुवात करून पुढील पावले ठरवूया का?"
"ms": "Hai semua, terima kasih kerana menyertai. Adakah kita mulakan dengan kemas kini ringkas, kemudian bersetuju tentang langkah seterusnya?"
"ne": "सबैलाई नमस्कार, सहभागी हुनुभएकोमा धन्यवाद। के हामी छोटो जानकारीबाट सुरु गरेर अगाडिका कदमहरू तय गरौँ?"
"nl": "Goedemiddag allemaal, bedankt dat jullie erbij zijn. Zullen we beginnen met een korte update en daarna de volgende stappen afspreken?"
"nn": "God dag alle saman, takk for at de er med. Skal vi starte med ei kort oppdatering og så avtale dei neste stega?"
"no": "God dag alle sammen, takk for at dere er med. Skal vi starte med en kort oppdatering og deretter avtale de neste stegene?"
"pa": "ਸਭ ਨੂੰ ਸਤਿ ਸ੍ਰੀ ਅਕਾਲ, ਸ਼ਾਮਲ ਹੋਣ ਲਈ ਧੰਨਵਾਦ। ਕੀ ਅਸੀਂ ਇੱਕ ਛੋਟੀ ਜਾਣਕਾਰੀ ਨਾਲ ਸ਼ੁਰੂ ਕਰੀਏ, ਫਿਰ ਅਗਲੇ ਕਦਮ ਤੈਅ ਕਰੀਏ?"
"pl": "Dzień dobry wszystkim, dziękuję za dołączenie. Czy zaczniemy od krótkiego podsumowania, a potem ustalimy kolejne kroki?"
"pt": "Bom dia a todos, obrigado por participarem. Podemos começar com uma atualização rápida e depois combinar os próximos passos?"
"ro": "Bună ziua tuturor, vă mulțumesc că v-ați alăturat. Începem cu o scurtă actualizare și apoi stabilim pașii următori?"
"ru": "Всем добрый день, спасибо, что присоединились. Начнём с краткого обзора, а затем договоримся о следующих шагах?"
"sk": "Dobrý deň všetkým, ďakujem, že ste sa pripojili. Začneme krátkym zhrnutím a potom sa dohodneme na ďalších krokoch?"
"sl": "Pozdravljeni vsi, hvala, da ste se nam pridružili. Ali začnemo s kratkim pregledom in se nato dogovorimo o naslednjih korakih?"
"sq": "Përshëndetje të gjithëve, faleminderit që u bashkuat. Të fillojmë me një përditësim të shkurtër dhe pastaj të bien dakord për hapat e radhës?"
"sr": "Здраво свима, хвала што сте се придружили. Да ли да почнемо кратким прегледом, а затим да се договоримо о следећим корацима?"
"sv": "Hej allihopa, tack för att ni är med. Ska vi börja med en kort uppdatering och sedan bestämma nästa steg?"
"sw": "Habari za asubuhi nyote, asanteni kwa kujiunga. Tuanze na taarifa fupi, kisha tukubaliane kuhusu hatua zinazofuata?"
"ta": "அனைவருக்கும் வணக்கம், இணைந்ததற்கு நன்றி. ஒரு சுருக்கமான தகவலுடன் தொடங்கி, அடுத்த படிகளை முடிவு செய்யலாமா?"
"te": "అందరికీ నమస్కారం, చేరినందుకు ధన్యవాదాలు. ఒక చిన్న సమీక్షతో మొదలుపెట్టి, తర్వాతి అడుగులను నిర్ణయించుకుందామా?"
"th": "สวัสดีครับทุกคน ขอบคุณที่เข้าร่วมนะครับ เริ่มจากสรุปความคืบหน้าสั้นๆ แล้วค่อยตกลงขั้นตอนต่อไปดีไหมครับ"
"tl": "Magandang araw sa lahat, salamat sa pagsali. Magsimula tayo sa maikling update, tapos pag-usapan natin ang susunod na hakbang?"
"tr": "Herkese merhaba, katıldığınız için teşekkürler. Kısa bir güncellemeyle başlayıp sonra sonraki adımlar üzerinde anlaşalım mı?"
"uk": "Доброго дня всім, дякую, що приєдналися. Почнемо з короткого огляду, а потім домовимося про наступні кроки?"
"ur": "سب کو سلام، شامل ہونے کا شکریہ۔ کیا ہم ایک مختصر اپ ڈیٹ سے آغاز کریں اور پھر اگلے اقدامات طے کریں؟"
"uz": "Hammaga salom, qo'shilganingiz uchun rahmat. Qisqa yangilanishdan boshlab, keyin keyingi qadamlarni kelishib olamizmi?"
"vi": "Xin chào mọi người, cảm ơn các bạn đã tham gia. Chúng ta bắt đầu bằng một bản cập nhật ngắn, rồi thống nhất các bước tiếp theo nhé?"
"yue": "大家好，多謝你哋嚟開會。我哋先簡單更新一下進度，然後商量下一步，好嗎？"
"zh": "大家好，感谢各位参加。我们先简单同步一下进展，然后商量下一步的安排，好吗？"
